<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<!--Tamanho padrão do ifram 300x150px-->
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do
        <iframe 
            src="http://www.cursoemvideo.com" frameborder="0"
            height="500"
            width="500"
            scrolling="no"
        >
            <a href="http://www.cursoemvideo.com" target="_blank">
                Curso em Vídeo
            </a>
        </iframe>

        para aprender a programar.
    </p>
    <p>
        O site

        <iframe src="https//www.google.com.br" frameborder="0"></iframe>

        tabém é muito legal, pena que não funciona dentro do iframe!
    </p>
    <p>
        O repositório do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            no <a href="https://gustavoguanabara.github.io" target="_blank">
                GitHub
            </a>
        </iframe>

        também é bem legal
    </p>
</body>

</html>
