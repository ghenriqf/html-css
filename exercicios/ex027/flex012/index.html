<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .conteiner {
            display: flex;
            background-color: lightblue;
            flex-flow: row nowrap;
        }
        .item {
            background-color: lightpink;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        #a{
            /* flex-shrink: 0; segundo
            flex-grow: 1; primeiro
            flex-basis: 200px; terceiro */

            flex: 1 0 200px
        }
        #b{
            /* flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px; */

            flex: 1 1 150px;
        }
        #c{
            /* flex-shrink: 2;
            flex-grow: 1;
            flex-basis: auto; */

            flex: 1 2 auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
    </div>
</body>
</html>
