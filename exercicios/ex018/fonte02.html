<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: Smiley;
            src: url(fonts/smiley-notes.otf) format('opentype');
            /* 
            Tipos de format()
            - opentype
            - truetype
            - embedded-opentype
            - truetype-aat
            - svg
            
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'Smiley';
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestiae maiores iure sapiente! Aut vitae accusamus ipsa molestiae! Exercitationem enim voluptatum sint porro laboriosam quaerat molestiae! Non laboriosam excepturi laudantium neque?</p>
</body>
</html>
